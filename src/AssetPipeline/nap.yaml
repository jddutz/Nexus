root: ./Assets

assets:
  - assetType: texture
    path: Art/Characters/Portraits
    groupName: portraits    
    files:
      - Hero/Warrior.png
      - Enemy/Mage.png

  - assetType: texture
    path: UI/Elements/Textures
    groupName: ui
    files:
      - Button.png
      - Panel.png

  # Fonts are compiled to Content/fonts/<contentId>/ and are never copied verbatim.
  - assetType: font
    contentId: ui.default
    source: Fonts/Roboto-Regular.ttf
    glyphs:
      repertoire: ascii
    generation:
      emSize: 48
      distanceRange: 4
      padding: 2
